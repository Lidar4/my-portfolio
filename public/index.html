<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও প্লেয়ার - মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-center shadow-2xl">
        <div class="mb-4">
            <span class="bg-pink-600/20 text-pink-500 text-xs font-semibold px-3 py-1 rounded-full">মিনি অ্যাপ ব্রিজ</span>
        </div>
        <h2 id="videoTitle" class="text-lg font-bold text-zinc-100 mb-4">ভিডিও লোড হচ্ছে...</h2>
        <div id="videoContainer">
            <a id="watchBtn" href="#" target="_blank" class="hidden block bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-pink-600/30">
                ▶️ সরাসরি ভিডিও দেখুন
            </a>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('v');
        
        if (targetUrl) {
            document.getElementById('watchBtn').href = targetUrl;
            document.getElementById('watchBtn').classList.remove('hidden');
            document.getElementById('videoTitle').innerText = "আপনার ভিডিও দেখার জন্য প্রস্তুত!";
        } else {
            document.getElementById('videoTitle').innerText = "⚠️ কোনো ভিডিও লিংক পাওয়া যায়নি।";
        }
    </script>
</body>
</html>
