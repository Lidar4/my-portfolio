<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও প্লেয়ার</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center shadow-2xl">
        <h2 class="text-xl font-bold text-pink-500 mb-2">🎬 ভিডিও প্লেয়ার</h2>
        <p id="videoTitle" class="text-sm text-slate-300 mb-4">ভিডিও লোড হচ্ছে...</p>
        <div id="videoContainer" class="mb-6">
            <a id="watchBtn" href="#" target="_blank" class="inline-block bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 px-6 rounded-xl transition w-full">
                সরাসরি ভিডিও দেখুন
            </a>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('v');
        if (targetUrl) {
            document.getElementById('watchBtn').href = targetUrl;
            document.getElementById('videoTitle').innerText = "ভিডিও দেখতে নিচের বাটনে ক্লিক করুন:";
        } else {
            document.getElementById('videoTitle').innerText = "কোনো ভিডিও সিলেক্ট করা হয়নি।";
            document.getElementById('watchBtn').style.display = 'none';
        }
    </script>
</body>
</html>
