<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও সার্চ ইঞ্জিন</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-p-4">
    <div class="max-w-md mx-auto p-4">
        <h1 class="text-xl font-bold text-center mb-4 text-pink-500">🌟 রিয়েল-টাইম সার্চ ইঞ্জিন</h1>
        
        <!-- সার্চ বক্স -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="কীওয়ার্ড বা ক্যাটাগরি লিখুন..." class="flex-1 p-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-pink-500">
            <button onclick="searchVideos()" class="bg-pink-600 px-5 py-3 rounded-lg font-bold hover:bg-pink-500 transition">সার্চ</button>
        </div>

        <!-- রেজাল্ট দেখানোর জায়গা -->
        <div id="results" class="space-y-4">
            <p class="text-center text-slate-400">অনুগ্রহ করে সার্চ করুন...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function searchVideos() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            if(!query) return;

            resultsDiv.innerHTML = '<p class="text-center text-pink-400">খোঁজা হচ্ছে...</p>';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if(data.length > 0) {
                    resultsDiv.innerHTML = '';
                    data.forEach(v => {
                        resultsDiv.innerHTML += `
                            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex gap-3 items-center">
                                <img src="${v.image || 'https://via.placeholder.com/100'}" class="w-24 h-16 object-cover rounded-lg">
                                <div class="flex-1 overflow-hidden">
                                    <h3 class="font-semibold text-sm truncate">${v.title}</h3>
                                    <p class="text-xs text-slate-400 mt-1">সময়: ${v.duration || 'N/A'}</p>
                                    <a href="${v.url}" target="_blank" class="inline-block mt-2 text-xs bg-pink-600 px-3 py-1 rounded text-white font-bold">ভিডিও দেখুন</a>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    resultsDiv.innerHTML = '<p class="text-center text-red-400">কোনো ভিডিও পাওয়া যায়নি।</p>';
                }
            } catch(e) {
                resultsDiv.innerHTML = '<p class="text-center text-red-400">সমস্যা হয়েছে, আবার চেষ্টা করুন।</p>';
            }
        }
    </script>
</body>
</html>
